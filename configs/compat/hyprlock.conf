# LainOS lock screen: original wallpaper and screen-relative placement.
background {
    path = /usr/share/backgrounds/lainos/wallpapers and backgrounds/empty-Lain.png
    color = rgb(111111)
}

label {
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 232, 172, 1.0)
    font_size = 64
    position = 0, 0
    halign = center
    valign = center
}

input-field {
    size = 20%, 5%
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(231, 111, 139, 1.0)
    inner_color = rgba(0, 0, 0, 0.0)
    font_color = rgb(248, 248, 242)
    fade_on_empty = false
    placeholder_text = <i>password</i>
    position = 0, -100
    halign = center
    valign = center
}
